Title: 'MAIP: antimalarial activity prediction'
Description: Scores compounds for blood-stage antimalarial activity against Plasmodium
  falciparum. Bosc and colleagues at the European Bioinformatics Institute drew on
  eleven proprietary screening sets from five partners, some 6.5 million bioactivity
  measurements, and pooled them by exchanging naive Bayes models rather than compounds,
  so no partner disclosed its chemistry. A single metamodel reproduces that consensus
  in one pass, reaching ROC AUC of 0.67 to 0.82 on three validation sets. Ersilia
  now runs the weights ChEMBL released locally instead of calling the web service.
