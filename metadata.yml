Title: 'MAIP: antimalarial activity prediction'
Description: 'Scores compounds for blood-stage antimalarial activity against Plasmodium falciparum. MAIP was built by Bosc and colleagues at the European Bioinformatics Institute from an unusual foundation: several pharmaceutical companies contributed proprietary screening results, which were combined with public data into a consensus model without any single dataset being disclosed. That breadth is its main strength, since antimalarial screening data are otherwise fragmented across organisations that rarely pool them.'
