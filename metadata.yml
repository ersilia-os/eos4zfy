Identifier: eos4zfy
Slug: maip-malaria
Status: In progress
Title: 'MAIP: antimalarial activity prediction'
Description: Prediction of the antimalarial potential of small molecules against
  the blood stage of Plasmodium falciparum. MAIP is a consensus naive-Bayes 
  model derived from 6.5 million malaria bioactivity values across 11 
  proprietary compound collections, combined without ever sharing the underlying
  compound structures. This version runs the model fully locally using the 
  open-source weights released by ChEMBL under the MIT license, reproducing the 
  scores of the previous online-server implementation.
